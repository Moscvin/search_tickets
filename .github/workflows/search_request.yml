name: Căutare la cerere (din Telegram)

# Pornit de Worker-ul Cloudflare (cloudflare/worker.js) când alegi o rută din meniul botului
on:
  workflow_dispatch:
    inputs:
      button:
        description: "Butonul din meniu (ex. s:RMO:MIL:5:7:010:2026101620270414)"
        required: false
      text:
        description: "Mesajul scris botului (ex. Chișinău - Dubai 7 zile)"
        required: false
      chat:
        description: "Chat-ul la care trimitem rezultatul (implicit: adminul)"
        required: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Caută și trimite rezultatul pe Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          BUTTON: ${{ inputs.button }}
          TEXT: ${{ inputs.text }}
          CHAT: ${{ inputs.chat }}
        run: |
          if [ -n "$BUTTON" ]; then python bot.py --run-button "$BUTTON"; else python bot.py --run-text "$TEXT"; fi
