name: Actualizează destinațiile din meniu

# Pornit zilnic de Worker-ul Cloudflare: recalculează routes.json (zborurile directe din fiecare oraș)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python bot.py --export-routes routes.json

      - name: Salvează routes.json în repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes.json
          git diff --cached --quiet || (git commit -m "Actualizează destinațiile din meniu" && git push)
